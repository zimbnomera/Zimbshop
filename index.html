<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ZIMB SIGNAL</title>

<style>

body{
margin:0;
background:black;
color:#00ff9f;
font-family:monospace;
overflow:hidden;
}

/* загрузка */

#loading{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:22px;
z-index:1000;
}

/* основной экран */

#main{
display:none;
text-align:center;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

/* glitch */

.glitch{
font-size:70px;
animation:glitch 1s infinite;
letter-spacing:6px;
}

@keyframes glitch{
0%{text-shadow:3px 3px red;}
50%{text-shadow:-3px -3px cyan;}
100%{text-shadow:3px -3px red;}
}

.subtitle{
color:#ff004c;
margin-top:10px;
font-size:20px;
}

button{
background:#00ff9f;
border:none;
padding:18px 40px;
font-size:20px;
cursor:pointer;
margin-top:40px;
}

button:hover{
background:#ff004c;
color:white;
}

#terminal{
margin-top:30px;
font-size:16px;
}

/* матрица */

canvas{
position:fixed;
top:0;
left:0;
z-index:-3;
}

/* AI глаза */

.eye{
position:fixed;
width:160px;
height:160px;
border-radius:50%;
border:3px solid #00ff9f;
box-shadow:0 0 30px #00ff9f;
display:flex;
justify-content:center;
align-items:center;
z-index:-2;
}

.pupil{
width:40px;
height:40px;
background:#ff004c;
border-radius:50%;
position:absolute;
}

/* сканер */

#scanner{
position:fixed;
width:100%;
height:0;
background:rgba(0,255,150,0.1);
top:0;
left:0;
z-index:999;
pointer-events:none;
}

/* счетчик */

#counter{
position:fixed;
bottom:10px;
right:20px;
font-size:14px;
color:#00ff9f;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="scanner"></div>

<!-- AI глаза -->

<div class="eye" id="eye1"><div class="pupil"></div></div>
<div class="eye" id="eye2"><div class="pupil"></div></div>
<div class="eye" id="eye3"><div class="pupil"></div></div>

<div id="loading">
<div id="loadText">INITIALIZING NETWORK...</div>
</div>

<div id="main">

<h1 class="glitch">ZIMB SIGNAL</h1>

<div class="subtitle">Hidden Number Market</div>

<div id="terminal"></div>

<a href="https://t.me/zimbnomer" id="shopLink">
<button>ACCESS NUMBER MARKET</button>
</a>

</div>

<div id="counter">Transitions: 0</div>

<script>

/* загрузка */

let loadMessages=[
"INITIALIZING NETWORK...",
"SCANNING USER DEVICE...",
"DETECTING SIGNAL...",
"VERIFYING ACCESS...",
"ACCESS GRANTED"
];

let l=0;

function loading(){

if(l<loadMessages.length){

document.getElementById("loadText").innerText=loadMessages[l];
l++;

setTimeout(loading,900);

}else{

document.getElementById("loading").style.display="none";
document.getElementById("main").style.display="block";
startTerminal();
startScanner();

}

}

loading();

/* терминал */

let terminalLines=[
"> connecting to hidden server...",
"> encrypted channel established...",
"> loading number marketplace...",
"> security bypassed",
"> welcome user"
];

let t=0;

function startTerminal(){

let terminal=document.getElementById("terminal");

let interval=setInterval(()=>{

if(t<terminalLines.length){

terminal.innerHTML+=terminalLines[t]+"<br>";
t++;

}else{

clearInterval(interval);

}

},700);

}

/* матрица */

let canvas=document.getElementById("matrix");
let ctx=canvas.getContext("2d");

canvas.height=window.innerHeight;
canvas.width=window.innerWidth;

let letters="01".split("");
let fontSize=14;
let columns=canvas.width/fontSize;

let drops=[];

for(let x=0;x<columns;x++)
drops[x]=1;

function draw(){

ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#00ff9f";
ctx.font=fontSize+"px monospace";

for(let i=0;i<drops.length;i++){

let text=letters[Math.floor(Math.random()*letters.length)];

ctx.fillText(text,i*fontSize,drops[i]*fontSize);

if(drops[i]*fontSize>canvas.height&&Math.random()>0.975)
drops[i]=0;

drops[i]++;

}

}

setInterval(draw,33);

/* AI глаза следят за курсором */

document.addEventListener("mousemove",function(e){

document.querySelectorAll(".pupil").forEach(pupil=>{

let x=(e.clientX/window.innerWidth-0.5)*40;
let y=(e.clientY/window.innerHeight-0.5)*40;

pupil.style.transform="translate("+x+"px,"+y+"px)";

});

});

/* движение глаз */

function moveEyes(){

document.querySelectorAll(".eye").forEach(eye=>{

let x=Math.random()*window.innerWidth;
let y=Math.random()*window.innerHeight;

eye.style.left=x+"px";
eye.style.top=y+"px";

});

}

setInterval(moveEyes,4000);

/* сканер пользователя */

function startScanner(){

let scanner=document.getElementById("scanner");

let pos=0;

setInterval(()=>{

pos+=5;

scanner.style.height=pos+"px";

if(pos>window.innerHeight){
pos=0;
scanner.style.height="0px";
}

},30);

}

/* счетчик переходов */

let count=localStorage.getItem("tg_clicks") || 0;

document.getElementById("counter").innerText="Transitions: "+count;

document.getElementById("shopLink").addEventListener("click",function(){

count++;

localStorage.setItem("tg_clicks",count);

});

</script>

</body>
</html>
