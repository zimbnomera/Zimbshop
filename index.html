<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ZIMB SIGNAL</title>
<style>
body{
  margin:0;
  background:black;
  color:#00ff9f;
  font-family:monospace;
  overflow:hidden;
}

/* загрузка */
#loading{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:22px;
  z-index:1000;
}

/* основной экран */
#main{
  display:none;
  text-align:center;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* glitch */
.glitch{
  font-size:70px;
  animation:glitch 1s infinite;
  letter-spacing:6px;
}
@keyframes glitch{
  0%{text-shadow:3px 3px red;}
  50%{text-shadow:-3px -3px cyan;}
  100%{text-shadow:3px -3px red;}
}

.subtitle{
  color:#ff004c;
  margin-top:10px;
  font-size:20px;
}

button{
  background:#00ff9f;
  border:none;
  padding:18px 40px;
  font-size:20px;
  cursor:pointer;
  margin-top:40px;
  transition:0.3s;
}
button:hover{
  background:#ff004c;
  color:white;
}

#terminal{
  margin-top:30px;
  font-size:16px;
}

/* матрица */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-4;
}

/* сканер */
#scanner{
  position:fixed;
  width:100%;
  height:0;
  background:rgba(0,255,150,0.1);
  top:0;
  left:0;
  z-index:999;
  pointer-events:none;
}

/* счетчик */
#counter{
  position:fixed;
  bottom:10px;
  right:20px;
  font-size:14px;
  color:#00ff9f;
  z-index:1000;
}

/* призрачные силуэты */
.ghost{
  position:fixed;
  width:200px;
  height:300px;
  background:rgba(255,255,255,0.03);
  border-radius:50% 50% 0 0;
  filter: blur(8px);
  animation:floatGhost linear infinite;
  z-index:-3;
}
@keyframes floatGhost{
  0% {transform: translateY(100vh);}
  100% {transform: translateY(-350px);}
}

/* динамический туман */
#fog{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,255,150,0.02);
  pointer-events:none;
  z-index:-2;
}

/* мигающие предупреждения */
.warning{
  position:fixed;
  top:10%;
  left:50%;
  transform:translateX(-50%);
  font-size:28px;
  color:red;
  font-weight:bold;
  opacity:0;
  animation:blink 2s infinite;
  z-index:1000;
}
@keyframes blink{
  0%,50%,100%{opacity:0;}
  25%,75%{opacity:1;}
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div id="fog"></div>

<div class="ghost" style="left:10%; animation-duration:25s;"></div>
<div class="ghost" style="left:40%; animation-duration:30s;"></div>
<div class="ghost" style="left:70%; animation-duration:35s;"></div>

<div class="warning" id="warningText">SECURITY BREACH DETECTED</div>

<div id="scanner"></div>

<div id="loading">
  <div id="loadText">INITIALIZING NETWORK...</div>
</div>

<div id="main">
  <h1 class="glitch">ZIMB SIGNAL</h1>
  <div class="subtitle">Hidden Number Market</div>
  <div id="terminal"></div>
  <a href="https://t.me/zimbnomer" id="shopLink">
    <button>ACCESS NUMBER MARKET</button>
  </a>
</div>

<div id="counter">Transitions: 0</div>

<script>
/* загрузка */
let loadMessages=[
  "INITIALIZING NETWORK...",
  "SCANNING USER DEVICE...",
  "DETECTING SIGNAL...",
  "VERIFYING ACCESS...",
  "ACCESS GRANTED"
];
let l=0;
function loading(){
  if(l<loadMessages.length){
    document.getElementById("loadText").innerText=loadMessages[l];
    l++;
    setTimeout(loading,900);
  }else{
    document.getElementById("loading").style.display="none";
    document.getElementById("main").style.display="block";
    startTerminal();
    startScanner();
    startWarnings();
  }
}
loading();

/* терминал */
let terminalLines=[
  "> connecting to hidden server...",
  "> encrypted channel established...",
  "> loading number marketplace...",
  "> security bypassed",
  "> welcome user"
];
let t=0;
function startTerminal(){
  let terminal=document.getElementById("terminal");
  let interval=setInterval(()=>{
    if(t<terminalLines.length){
      terminal.innerHTML+=terminalLines[t]+"<br>";
      t++;
    }else{
      clearInterval(interval);
    }
  },700);
}

/* матрица */
let canvas=document.getElementById("matrix");
let ctx=canvas.getContext("2d");
canvas.height=window.innerHeight;
canvas.width=window.innerWidth;
let letters="01".split("");
let fontSize=14;
let columns=canvas.width/fontSize;
let drops=[];
for(let x=0;x<columns;x++) drops[x]=1;
function draw(){
  ctx.fillStyle="rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#00ff9f";
  ctx.font=fontSize+"px monospace";
  for(let i=0;i<drops.length;i++){
    let text=letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*fontSize,drops[i]*fontSize);
    if(drops[i]*fontSize>canvas.height&&Math.random()>0.975) drops[i]=0;
    drops[i]++;
  }
}
setInterval(draw,33);

/* сканер */
function startScanner(){
  let scanner=document.getElementById("scanner");
  let pos=0;
  setInterval(()=>{
    pos+=5;
    scanner.style.height=pos+"px";
    if(pos>window.innerHeight){
      pos=0;
      scanner.style.height="0px";
    }
  },30);
}

/* счетчик переходов */
let count=localStorage.getItem("tg_clicks") || 0;
document.getElementById("counter").innerText="Transitions: "+count;
document.getElementById("shopLink").addEventListener("click",function(){
  count++;
  localStorage.setItem("tg_clicks",count);
});

/* мигающие предупреждения */
function startWarnings(){
  let warning=document.getElementById("warningText");
  setInterval(()=>{
    warning.style.left=Math.random()*80+10+"%";
    warning.style.top=Math.random()*40+10+"%";
  },3000);
}
</script>

</body>
</html>
